name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Warn if committed token files are stale
        run: npm run check:tokens || echo "::warning::tokens.css / tokens.js were out of date in the commit. They are rebuilt for this deploy — run 'npm run build:tokens' locally and commit to keep the repo in sync."

      - name: Build tokens
        run: npm run build:tokens

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html design-system.html .nojekyll _site/
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
