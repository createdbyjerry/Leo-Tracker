<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Watch — LEO Satellite Tracker</title>
  <meta name="description" content="Real-time 3D tracker for Earth-observation satellites in low Earth orbit, with ground track, pass predictions and conjunction alerts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2333ff88' stroke-width='2'/%3E%3Ccircle cx='25' cy='9' r='3' fill='%23ff5533'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/orbital-watch.css">
</head>
<body>
  <div id="prototype-wrapper">
    <div class="hud-main">
      <div id="canvas-container">
        <div class="scanline"></div>
      </div>

      <aside class="side-panel side-panel--main" aria-label="Mission control">
        <div class="panel-head panel-head--brand">
          <div class="brand">
            <span class="brand-eyebrow">LEO / TRACK</span>
            <span class="brand-title">ORBITAL WATCH</span>
          </div>
          <button id="update-tle-btn" class="hud-btn hud-btn--accent" type="button">Update Data</button>
        </div>

        <div class="panel-subhead panel-subhead--first">
          <span>CATALOG</span><span id="cat-count" class="panel-count">— objects</span>
        </div>
        <div id="catalog-list" class="catalog-list"></div>

        <div class="panel-subhead"><span>CONJUNCTIONS</span></div>
        <div id="conjunction-list" class="conjunction-list" aria-live="polite"></div>

        <div class="panel-subhead">
          <span>TELEMETRY</span>
          <span id="last-updated" class="panel-timestamp">Static demo data</span>
        </div>
        <div id="sat-hint" class="hud-hint">AWAITING TARGET LOCK — click a satellite to view telemetry</div>
        <div id="hud-readout" class="hud-readout" style="display:none;">
          <div class="hud-readout__name" id="sat-name">—</div>
          <div class="hud-readout__sub" id="sat-designation">Int'l Designator: —</div>
          <div class="hud-readout__station" id="station-line">Ground station: —</div>
          <div id="field-grid" class="hud-grid"></div>
        </div>

        <div class="legend">
          <div class="legend-row"><span class="dot dot--tracked"></span>Tracked</div>
          <div class="legend-row"><span class="dot dot--selected"></span>Selected / orbit</div>
          <div class="legend-row"><span class="dot dot--station"></span>Ground station</div>
        </div>
      </aside>

      <div class="map2d" id="map2d">
        <div class="map2d-head">
          <span class="panel-label">GROUND TRACK</span>
          <button id="map2d-expand-btn" class="hud-btn" type="button" title="Expand" aria-expanded="false">Expand</button>
        </div>
        <div class="map2d-body">
          <div class="map2d-bg"></div>
          <svg id="map2d-svg" viewBox="0 0 100 100" preserveAspectRatio="none" class="map2d-svg" aria-label="Ground track map">
            <path id="map2d-track" class="map2d-track-path"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script src="assets/js/tokens.js"></script>
  <script src="assets/js/orbital-watch.js"></script>
</body>
</html>
